[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Sandrez12/and23"
homepage = "https://github.com/Sandrez12/and23"
authors = ["Andres Felipe Joya Buitrago"]
readme = "README.md"
keywords = ["lenguaje", "compilador", "vm", "bytecode"]
categories = ["compilers"]

# Las pruebas ejecutan millones de instrucciones de la VM: sin optimizar tardarían demasiado.
[profile.dev]
opt-level = 2
