name: Release

# Se ejecuta al subir una etiqueta `v*` (por ejemplo `v0.2.0`): compila el binario de cada sistema y
# crea la release de GitHub con los archivos adjuntos.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Compilar
        run: cargo build --release --locked -p and23-cli --target ${{ matrix.target }}
      - name: Probar el binario
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/and23
          [ -f "$bin" ] || bin="$bin.exe"
          "$bin" --version
          test "$("$bin" examples/aritmetica.jb | head -1)" = "7"
          "$bin" --check examples/clases.jb
          "$bin" mn/checker.jb examples/clases.jb
          # Los programas reales (varios archivos, `use`, pruebas) y el punto fijo de la autocompilación.
          "$bin" --prueba proyectos/buscador/buscador_prueba.jb
          "$bin" --prueba proyectos/calculadora/calc_prueba.jb
          test "$("$bin" proyectos/calculadora/calc.jb "2 + 3 * 4")" = "14.0000"
          "$bin" mn/compilador.jb --preludio > preludio.txt
          "$bin" mn/compilador.jb mn/compilador.jb > compilador.txt
          "$bin" --carga preludio.txt compilador.txt mn/compilador.jb > compilador2.txt
          cmp compilador.txt compilador2.txt
      - name: Empaquetar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name=and23-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/and23 README.md LICENSE "$name"/
          cp -r examples "$name"/
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name=and23-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/and23.exe README.md LICENSE "$name"/
          cp -r examples "$name"/
          7z a "$name.zip" "$name"
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  vsix:
    name: extensión de VS Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Empaquetar la extensión
        working-directory: editors/vscode
        run: |
          cp ../../LICENSE LICENSE
          npx --yes @vscode/vsce@4.1.0 package --no-dependencies -o ../../and23-vscode-${{ github.ref_name }}.vsix
      - name: Publicar en el Marketplace (si hay token)
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce@4.1.0 publish --no-dependencies --packagePath ../../and23-vscode-${{ github.ref_name }}.vsix
          else
            echo "No hay secreto VSCE_PAT: la extensión no se publica en el Marketplace (queda como archivo .vsix de la release)."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: and23-vscode-${{ github.ref_name }}.vsix

  release:
    needs: [build, vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas de verificación
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* scripts/instalar.sh scripts/instalar.ps1 --repo "${{ github.repository }}" --title "And23 ${{ github.ref_name }}" --generate-notes
